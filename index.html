<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyGoals</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="apple-touch-icon" href="logo.jpg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffced8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MyGoals" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Security Lock Screen -->
  <section class="auth-screen" id="authScreen">
    <div class="auth-card">
      <img src="logo.jpg" alt="Logo" class="auth-logo" />
      <h1 class="auth-title">MyGoals</h1>
      <p class="auth-subtitle">Enter your credentials to access your goals</p>

      <form class="auth-form" id="authForm">
        <div class="auth-field">
          <label for="authUsername" class="auth-label">Username</label>
          <input
            type="text"
            id="authUsername"
            class="auth-input"
            placeholder="Enter username"
            value="sandeep"
            autocomplete="username"
            required
          />
        </div>

        <div class="auth-field">
          <label for="authPassword" class="auth-label">Password / PIN</label>
          <div class="password-input-wrap">
            <input
              type="password"
              id="authPassword"
              class="auth-input"
              placeholder="Enter PIN (e.g. 5000)"
              pattern="[0-9]*"
              inputmode="numeric"
              autocomplete="current-password"
              required
            />
            <button type="button" class="btn-toggle-pwd" id="btnTogglePwd" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div class="auth-remember">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked />
            <span class="custom-checkbox"></span>
            Keep me logged in on this device
          </label>
        </div>

        <div class="auth-error" id="authError" style="display: none;">
          Incorrect password. Please try again.
        </div>

        <button type="submit" class="btn-unlock">
          <span>🔓</span> Unlock MyGoals
        </button>
      </form>
    </div>
  </section>

  <!-- Main Application Container (Protected) -->
  <main class="app-container" id="appContainer" style="display: none;">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <img src="logo.jpg" alt="Logo" class="brand-logo" />
          <div>
            <h1 class="brand-title">MyGoals</h1>
            <p class="current-date" id="currentDate"></p>
          </div>
        </div>
        <button type="button" class="btn-lock" id="btnLock" title="Lock MyGoals">
          <span>🔒</span> Lock
        </button>
      </div>

      <!-- Progress Tracker -->
      <div class="progress-card">
        <div class="progress-info">
          <span class="progress-label">Goal Progress</span>
          <span class="progress-percent" id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <p class="progress-summary" id="progressSummary">0 of 0 goals completed</p>
      </div>
    </header>

    <!-- Add Goal Input -->
    <form class="add-goal-form" id="addGoalForm">
      <input
        type="text"
        id="goalInput"
        class="goal-input"
        placeholder="Enter a goal you want to achieve..."
        autocomplete="off"
        required
      />
      <button type="submit" class="btn-add">
        <span class="btn-plus">+</span> Add Goal
      </button>
    </form>

    <!-- Filters -->
    <nav class="filter-tabs">
      <button class="filter-btn active" data-filter="all">
        All <span class="badge" id="badgeAll">0</span>
      </button>
      <button class="filter-btn" data-filter="pending">
        Pending <span class="badge" id="badgePending">0</span>
      </button>
      <button class="filter-btn" data-filter="completed">
        Completed <span class="badge" id="badgeCompleted">0</span>
      </button>
    </nav>

    <!-- Single Continuous Goals List -->
    <div class="goals-list" id="goalsList"></div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon">🎯</div>
      <h3>No goals yet</h3>
      <p>Type your goal above and press Enter or click Add Goal.</p>
    </div>

    <!-- Footer Actions -->
    <footer class="footer-bar" id="footerBar" style="display: none;">
      <button type="button" class="btn-clear" id="clearCompletedBtn">
        Clear completed goals
      </button>
    </footer>
  </main>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('ServiceWorker registration error:', err);
        });
      });
    }
  </script>
</body>
</html>
