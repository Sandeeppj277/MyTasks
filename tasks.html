<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTasks — My Goals & Tasks</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Nav -->
    <nav class="nav">
      <div class="logo">
        <img src="logo.jpg" alt="Logo" class="logo-img" />
        <h1>MyTasks</h1>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Add Tasks</a>
        <a href="tasks.html" class="nav-link active">My Goals & Tasks <span class="nav-badge" id="navBadge">0</span></a>
      </div>
    </nav>

    <!-- Overall Progress -->
    <div class="progress-card">
      <div class="progress-info">
        <span class="progress-label">Overall Goals Progress</span>
        <span class="progress-value" id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
      <p class="progress-detail" id="progressDetail">0 of 0 tasks completed across all goals</p>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">
        All Tasks <span class="badge" id="badgeAll">0</span>
      </button>
      <button class="filter-btn" data-filter="pending">
        Pending <span class="badge" id="badgePending">0</span>
      </button>
      <button class="filter-btn" data-filter="completed">
        Completed <span class="badge" id="badgeCompleted">0</span>
      </button>
    </div>

    <!-- Goals & Tasks Container -->
    <div class="goals-container" id="goalsContainer"></div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display: none">
      <div class="empty-icon">🎯</div>
      <h3>No tasks found</h3>
      <p>Go to <a href="index.html" style="color: var(--accent-dark); font-weight: 600;">Add Tasks</a> to add tasks to your goals.</p>
    </div>

    <!-- Footer -->
    <div class="footer" id="footer" style="display: none">
      <button class="btn-clear" id="clearCompleted">Clear All Completed Tasks</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
